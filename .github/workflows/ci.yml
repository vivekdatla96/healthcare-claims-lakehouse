name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q --ignore=tests/test_gold_incremental.py
      - name: Incremental gold regression (CDC, no-op, full refresh)
        run: pytest -q tests/test_gold_incremental.py
      - name: End-to-end pipeline
        run: make all
