[project]
name = "claims-lakehouse"
version = "0.1.0"
description = "Medallion-style healthcare claims pipeline with CDC, PHI tokenization, dbt and Airflow"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.4,<3"]

[project.scripts]
claims = "claims_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
